# Release: dev artifact on main, AMO package published on version tags.
#
# Fixes two bugs from the README manual snippet:
#   1. it omitted _locales/ (without it every __MSG_* string breaks); and
#   2. it prefixed paths with 'cobalt-firefox-extension/' (i.e. assumed CWD was
#      the parent dir). This workflow always runs from the repo root with plain
#      relative paths.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # minimal scope: needed to upload artifacts/releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      # AMO package: ONLY extension files, from the repo root.
      # Excluded by construction: native-host/, docs (*.md, *.png screenshots
      # at root), .git, __pycache__ — they are simply never added to the zip.
      - name: Build AMO zip (repo root, relative paths)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="cobalt-firefox-extension-amo-${VERSION}.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" \
            manifest.json \
            cobalt.js \
            background.js \
            popup.html popup.js popup.css \
            options.html options.js \
            picker.html picker.js \
            LICENSE \
            _locales/en/messages.json \
            _locales/pt_BR/messages.json \
            icons/icon-32.png \
            icons/icon-48.png \
            icons/icon-64.png \
            icons/icon-96.png \
            icons/icon-128.png
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "--- contents ---"
          unzip -l "$ZIP"

      - name: Upload dev artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-dev-${{ github.sha }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
