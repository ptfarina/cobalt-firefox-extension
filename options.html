<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="optTitle">Settings — Cobalt Downloader</title>
<style>
body { font: 14px/1.5 system-ui, sans-serif; max-width: 620px; margin: 24px auto; padding: 0 16px; }
label { display: block; margin: 12px 0; }
input, select { width: 100%; padding: 8px; margin-top: 4px; }
button { padding: 8px 14px; }
.hint { font-size: 12px; opacity: .75; }
.warn { background: #fff3cd; border: 1px solid #e0c36a; padding: 10px; border-radius: 4px; }
code { background: #eee; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<h1 data-i18n="optH1">Settings — Cobalt Downloader</h1>

<div class="warn" data-i18n-html="optWarn"></div>

<label><span data-i18n="optInstanceUrl">Instance URL (POST /)</span>
  <input id="instanceUrl" placeholder="https://your-instance.example">
</label>

<label><span data-i18n="optApiKey">Api-Key (optional — required by some instances)</span>
  <input id="apiKey" type="password" placeholder="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">
  <span class="hint" data-i18n-html="optApiKeyHint"></span>
</label>

<label><span data-i18n="optModeDefault">Default mode</span>
  <select id="downloadMode">
    <option value="auto">auto</option>
    <option value="audio">audio</option>
    <option value="mute">mute</option>
  </select>
</label>

<label><span data-i18n="optQualityDefault">Default quality</span>
  <select id="videoQuality">
    <option>max</option><option>4320</option><option>2160</option><option>1440</option>
    <option selected>1080</option><option>720</option><option>480</option><option>360</option>
    <option>240</option><option>144</option>
  </select>
</label>

<label><span data-i18n="optAudioFormat">Audio format</span>
  <select id="audioFormat">
    <option>best</option><option selected>mp3</option><option>ogg</option><option>wav</option><option>opus</option>
  </select>
</label>

<label><span data-i18n="optFilenameStyle">Filename style</span>
  <select id="filenameStyle">
    <option selected>basic</option><option>pretty</option><option>classic</option><option>nerdy</option>
  </select>
</label>

<p>
  <button id="save" data-i18n="optSave">Save</button>
  <button id="test" data-i18n="optTest">Test (GET /)</button>
  <span id="msg" class="hint"></span>
</p>

<h2 data-i18n="optLocalH2">Local instance (Docker)</h2>
<p class="hint" data-i18n-html="optLocalHint"></p>
<p><span data-i18n="optLocalStatus">Local status:</span> <b id="localStatus">—</b></p>
<p>
  <button id="localUse" data-i18n="optLocalUseBtn">Use local instance</button>
  <button id="localStart" data-i18n="optLocalStart">Start now</button>
  <button id="localStop" data-i18n="optLocalStop">Stop now</button>
  <button id="localRefresh" data-i18n="optLocalRefresh">Refresh status</button>
</p>
<label><input id="localAuto" type="checkbox" style="width:auto"> <span data-i18n="optLocalAuto">Start with Firefox and stop on close (recommended)</span></label>

<h2 data-i18n="optAntibotH2">Anti-bot and logins (local instance)</h2>
<p class="hint" data-i18n-html="optAntibotHint"></p>
<ul class="hint" data-i18n-html="optAntibotList"></ul>
<p><span data-i18n="optAntibotStatus">Status:</span> <b id="antibotStatus">—</b></p>
<p>
  <button id="antibotRefresh" data-i18n="optAntibotRefresh">Refresh status</button>
  <button id="instanceRestart" data-i18n="optInstanceRestart">Restart instance (applies new cookies)</button>
</p>
<p class="hint" data-i18n-html="optCookiesGuide"></p>

<h2 data-i18n="optSessionH2">Session — protected instances</h2>
<p class="hint" data-i18n-html="optSessionGuideLead"></p>
<ol class="hint" data-i18n-html="optSessionGuide"></ol>
<label><span data-i18n="optJwtLabel">Manual Bearer JWT (optional)</span>
  <input id="jwtToken" type="password" placeholder="eyJhbGciOi…" autocomplete="off">
  <span class="hint" data-i18n="optJwtHint">Validity is read from the token itself and shown below.</span>
</label>
<p><span data-i18n="optSessionStatus">Session status:</span> <b id="sessionStatus">—</b></p>
<p>
  <button id="clearSession" data-i18n="optClearSession">Clear session</button>
</p>

<script src="cobalt.js"></script>
<script src="options.js"></script>
</body>
</html>
